{% extends "base.html" %}
{% block title %}إضافة مشجع — Smart Stadium{% endblock %}
{% block content %}
<h1 class="page-heading">إضافة مشجع</h1>
{% if error %}
<p style="color:var(--color-danger);font-weight:700;">{{ error }}</p>
{% endif %}
<form method="post" class="stack-form" style="max-width:520px;">
    <label for="full_name">الاسم الكامل</label>
    <input id="full_name" name="full_name" required>
    <label for="username">اسم المستخدم</label>
    <input id="username" name="username" required>
    <label for="password">كلمة المرور</label>
    <input id="password" name="password" type="password" required>
    <label for="ticket_number">رقم التذكرة</label>
    <input id="ticket_number" name="ticket_number" required>
    <label for="seat_id">المقعد الفارغ</label>
    <select id="seat_id" name="seat_id" required>
        {% for s in free_seats %}
        <option value="{{ s['id'] }}">قطاع {{ s['block'] }} — صف {{ s['row_number'] }} — رقم {{ s['seat_number'] }}</option>
        {% endfor %}
    </select>
    <label for="nationality">الجنسية</label>
    <input id="nationality" name="nationality">
    <label for="phone">الهاتف</label>
    <input id="phone" name="phone">
    <label for="language_pref">تفضيل اللغة</label>
    <select id="language_pref" name="language_pref">
        <option value="ar">العربية</option>
        <option value="en">English</option>
    </select>
    <div class="toolbar">
        <button type="submit" class="btn-primary">حفظ</button>
        <a class="btn-secondary" href="{{ url_for('fans.fan_list') }}">رجوع</a>
    </div>
</form>
{% endblock %}
